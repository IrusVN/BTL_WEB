<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Team2hand — Thời trang chính hãng</title>
        <meta name="description" content="Team2hand — cửa hàng thời trang chính hãng Adidas, Nike, Gucci, Dior, Balenciaga, Louis Vuitton, Prada." />
        <!-- Anti-flash theme (§4.10): set data-theme trước khi bundle tải,
             tránh flash nền sai khi reload ở light mode -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('theme');
                    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
                } catch (e) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
