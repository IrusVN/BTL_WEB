<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TransLux — Đồ hiệu 2hand</title><meta name="description" content="TransLux — nền tảng mua bán đồ hiệu secondhand chính hãng: Gucci, Louis Vuitton, Dior, Prada, Balenciaga..."/><meta name="theme-color" content="#0a0a0c"/><link rel="icon" type="image/png" href="logo-rmbg.png"/><script>(function () {
                try {
                    var t = localStorage.getItem('theme');
                    if (t !== 'light' && t !== 'dark') {
                        t = window.matchMedia('(prefers-color-scheme: light)').matches
                            ? 'light'
                            : 'dark';
                    }
                    document.documentElement.setAttribute('data-theme', t);
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', t === 'light' ? '#faf7f0' : '#0a0a0c');
                } catch (e) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            })();</script><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet"/><script defer="defer" src="/bundle.js"></script></head><body><div id="root"></div></body></html>
